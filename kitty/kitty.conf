# ==================== Kitty Terminal Config ====================
# Managed: ~/.config/vsad/config/kitty.md

# ---------- Font ----------
font_family Maple Mono NF
font_size 10.5

# ---------- Vanta Black Core Theme ----------
background #000000
foreground #ffffff
selection_background #222222
selection_foreground #ffffff

# ---------- Vibrant Syntax Colors ----------
# Basic colors (colour0-7) and bright colors (colour8-15)
color0 #1c1c1c
color1 #ff5f5f
color2 #5fff87
color3 #ffff87
color4 #5fafff
color5 #df87ff
color6 #5fffff
color7 #e4e4e4
color8 #4d4d4d
color9 #ff6e6e
color10 #6eff8e
color11 #ffff9e
color12 #6ebfff
color13 #e89eff
color14 #6effff
color15 #ffffff

# ---------- Visual Polish ----------
window_padding_width 10

# ---------- Bell & Interaction ----------
cursor_blink_interval 0.5
cursor_stop_blinking_after 8.0
mouse_hide_wait 3.0

# ---------- Advanced ----------
# Ensure key auto-repeat works for Vim/Neovim-style navigation
linux_display_server auto

# ==================== Symbol Mapping (Nerd Font Glyphs) ====================
# Maps specific Unicode blocks (arrows, icons, powerline prompts) to Symbols Nerd Font
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 Symbols Nerd Font

# ==================== Emoji Fallback Configuration ====================
# Tells Kitty to explicitly use Noto Color Emoji for smileys and custom objects
font_family_emoji Noto Color Emoji

