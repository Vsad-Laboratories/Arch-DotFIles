# ==================== Kitty Terminal Config ====================
# VSAD Pure Black Theme

# ---------- Font ----------
font_family Maple Mono NF
font_size 10

# ---------- Pure Black Theme ----------
background #000000
foreground #ffffff
selection_background #1a1a1a
selection_foreground #ffffff

# ---------- Cursor ----------
cursor #ffffff
cursor_blink_interval 0.5
cursor_stop_blinking_after 8.0

# ---------- Colors ----------
# Basic (pure black bg)
color0 #000000
color1 #ff5f5f
color2 #5fff87
color3 #ffff87
color4 #5fafff
color5 #df87ff
color6 #5fffff
color7 #ffffff

# Bright
color8 #333333
color9 #ff6e6e
color10 #6eff8e
color11 #ffff9e
color12 #6ebfff
color13 #e89eff
color14 #6effff
color15 #ffffff

# ---------- Transparency & Decorations ----------
background_opacity 0.72
hide_window_decorations yes
window_padding_width 10

# ---------- Advanced ----------
mouse_hide_wait 3.0
linux_display_server auto

# ---------- Symbol Mapping ----------
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 Symbols Nerd Font
font_family_emoji Noto Color Emoji
